<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>台灣植物圖鑑</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7f2;
            color: #26352a;
        }

        header {
            background: #315c3b;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .search {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .category {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: #dce9dd;
            cursor: pointer;
            font-size: 15px;
        }

        .category:hover {
            background: #c4dbc7;
        }

        .plants {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .scientific {
            color: #66736a;
            font-style: italic;
        }

        .tag {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            background: #e4eee5;
            border-radius: 10px;
            font-size: 13px;
        }
        .homeCategories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 20px;
}

.homeCategories button {
    background: white;
    border: none;
    border-radius: 20px;
    padding: 35px 20px;
    font-size: 45px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.homeCategories button strong {
    display: block;
    margin-top: 10px;
    font-size: 20px;
    color: #315c3b;
}

.homeCategories button:hover {
    transform: translateY(-3px);
}
.favorite-btn {
    float: right;
    border: none;
    background: none;
    font-size: 28px;
    cursor: pointer;
    padding: 0;
}

.favorite-btn:hover {
    transform: scale(1.15);
}
    </style>
    
</head>

<body>

<div id="homePage">

    <header>
        <h1>🌲 森林自然資源圖鑑</h1>
        <p>認識台灣的植物、動物與木材</p>
    </header>

    <div class="container">

        <div class="homeCategories">

            <button onclick="openCategory('plants')">
                🌿<br>
                <strong>植物圖鑑</strong>
            </button>

            <button onclick="openCategory('animals')">
                🐾<br>
                <strong>動物圖鑑</strong>
            </button>

            <button onclick="openCategory('woods')">
                🪵<br>
                <strong>木材圖鑑</strong>
            </button>

            <button onclick="openCategory('favorites')">
                ⭐<br>
                <strong>我的最愛</strong>
            </button>

        </div>

    </div>

</div>
<div id="plantPage" style="display:none;">
<header>
    <h1>🌿 台灣植物圖鑑</h1>
    <p>認識台灣的植物，從一棵樹開始。</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 搜尋植物名稱、學名或科別..."
    >

    <div class="categories">
        <button class="category" onclick="filterPlants('全部')">全部</button>
        <button class="category" onclick="filterPlants('木本')">🌳 木本</button>
        <button class="category" onclick="filterPlants('草本')">🌱 草本</button>
        <button class="category" onclick="filterPlants('蕨類')">🌿 蕨類</button>
    </div>

    <div class="plants" id="plants"></div>

</div>
</div>

<script>

const plants = [
    {
       name: "樟樹",
       scientific: "Cinnamomum camphora",
       family: "樟科",
       type: "木本",
       image: "images/IMG_0112.jpeg",
       distribution: "台灣低海拔至中海拔地區",
       features: "葉片揉碎具有特殊香氣，樹皮灰褐色。",
       use: "木材可供家具、建築及其他用途。"
    },

    {
        name: "牛樟",
        scientific: "Cinnamomum kanehirae",
        family: "樟科",
        type: "木本"
    },

    {
        name: "紅檜",
        scientific: "Chamaecyparis formosensis",
        family: "柏科",
        type: "木本"
    },

    {
        name: "筆筒樹",
        scientific: "Cyatheaceae",
        family: "桫欏科",
        type: "蕨類"
    }
];


const container = document.getElementById("plants");
const search = document.getElementById("search");


function showPlants(list) {

    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = "<p>找不到符合的植物 😭</p>";
        return;
    }

    list.forEach(plant => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
    <img src="${plant.image || ''}" alt="${plant.name}"
         style="width:100%; height:180px; object-fit:cover; border-radius:12px;">

    <button class="favorite-btn" onclick="toggleFavorite(event, '${plant.name}')">
        ${isFavorite(plant.name) ? "⭐" : "☆"}
    </button>

    <h2>${plant.name}</h2>

            <div class="scientific">${plant.scientific}</div>

            <p>${plant.family}</p>

            <span class="tag">${plant.type}</span>

            <p style="margin-top:15px; color:#315c3b;">
                👉 點擊查看詳細資料
            </p>
        `;

        card.style.cursor = "pointer";

        card.addEventListener("click", function() {

    document.getElementById("modalContent").innerHTML = `
        <h1>${plant.name}</h1>

        <p style="font-style:italic; color:#66736a;">
            ${plant.scientific}
        </p>

        <p>
            🌿 ${plant.family}　
            🌳 ${plant.type}
        </p>

        <hr>

        <h3>📍 分布</h3>
        <p>${plant.distribution || "尚未建立資料"}</p>

        <h3>🔎 辨識特徵</h3>
        <p>${plant.features || "尚未建立資料"}</p>

        <h3>🪵 利用價值</h3>
        <p>${plant.use || "尚未建立資料"}</p>
    `;

    document.getElementById("plantModal").style.display = "block";

});

        container.appendChild(card);

    });
}


function filterPlants(type) {

    if (type === "全部") {
        showPlants(plants);
        return;
    }

    const result = plants.filter(plant => plant.type === type);

    showPlants(result);
}


search.addEventListener("input", function() {

    const keyword = search.value.toLowerCase();

    const result = plants.filter(plant =>
        plant.name.includes(keyword) ||
        plant.scientific.toLowerCase().includes(keyword) ||
        plant.family.includes(keyword)
    );

    showPlants(result);

});


showPlants(plants);

function closeModal() {
    document.getElementById("plantModal").style.display = "none";
}
function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
}


function isFavorite(name) {
    const favorites = getFavorites();

    return favorites.includes(name);
}


function toggleFavorite(event, name) {

    event.stopPropagation();

    let favorites = getFavorites();

    if (favorites.includes(name)) {

        favorites = favorites.filter(item => item !== name);

    } else {

        favorites.push(name);

    }

    localStorage.setItem("favorites", JSON.stringify(favorites));

    showPlants(plants);
}
function openCategory(category) {

    if (category === "plants") {

        document.getElementById("homePage").style.display = "none";
        document.getElementById("plantPage").style.display = "block";

    }

}

</script>
<div id="plantModal" style="
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    overflow:auto;
">

    <div style="
        background:white;
        max-width:600px;
        margin:50px auto;
        padding:25px;
        border-radius:20px;
        width:85%;
    ">

        <button onclick="closeModal()" style="
            float:right;
            border:none;
            background:none;
            font-size:24px;
            cursor:pointer;
        ">✕</button>

        <div id="modalContent"></div>

    </div>

</div>
</body>
</html>
